<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>發票掃碼</title>
  <style>
    :root { color-scheme: light dark; }
    body { font-family: system-ui, sans-serif; margin: 0; padding: 16px; max-width: 42rem; }
    h1 { font-size: 1.25rem; margin: 0 0 12px; }
    label, p, button, input, select { font-size: 1rem; }
    label { display: block; margin: 12px 0 4px; }
    input, select, textarea { width: 100%; box-sizing: border-box; padding: 10px; border-radius: 8px; border: 1px solid #ccc; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 12px; }
    .row button { flex: 1 1 5.5rem; padding: 10px; border-radius: 8px; border: 1px solid #888; background: transparent; }
    .row button[aria-pressed="true"] { background: #1a73e8; color: #fff; border-color: #1a73e8; }
    #reader { position: relative; width: 100%; min-height: 220px; margin: 8px 0 12px; background: #111; border-radius: 8px; overflow: hidden; }
    #reader video { width: 100%; display: block; }
    #qrbox { position: absolute; inset: 0; margin: auto; width: 65%; max-height: 70%; aspect-ratio: 1; border: 2px solid rgba(255,255,255,.75); border-radius: 8px; pointer-events: none; box-sizing: border-box; }
    .actions { display: flex; gap: 8px; margin-top: 16px; }
    .actions button, .filebtn { flex: 1; padding: 14px; border: 0; border-radius: 8px; font-weight: 600; font-size: 1rem; text-align: center; cursor: pointer; }
    #sendAll, #backScan { background: #1a73e8; color: #fff; }
    #sendAll:disabled { opacity: .5; }
    .filebtn, #manualEntry, #deleteEntry { background: transparent; border: 1px solid #888; color: inherit; }
    .filebtn input { display: none; }
    #startCam, #stopCam, #parseManual { padding: 14px; border: 0; border-radius: 8px; font-weight: 600; }
    #result, #error, #fillError { white-space: pre-wrap; margin-top: 12px; }
    #error, #fillError { color: #c00; }
    .ok { color: #0a7d32; }
    .hint { color: #666; font-size: .9rem; }
    #manual { margin-top: 8px; }
    #camLabel select { width: auto; max-width: 100%; display: block; }
    #toast { margin: 0 0 12px; padding: 10px 12px; border-radius: 8px; font-weight: 600; text-align: center; }
    #toast.ok { background: #0a7d32; color: #fff; }
    #toast.dup { background: #e6b800; color: #111; }
    #toast[hidden] { display: none; }
    #reader.flash { outline: 4px solid #0a7d32; outline-offset: 2px; }
    #scanView[hidden], #fillView[hidden] { display: none; }
    .entry { border: 1px solid #ccc; border-radius: 8px; padding: 10px; margin: 8px 0; cursor: pointer; }
    .entry .meta { margin: 0; white-space: pre-wrap; }
    .entry.missing .meta { color: #c00; }
    .entry .status { color: #c00; margin: 8px 0 0; }
  </style>
</head>
<body>
  <h1>發票掃碼</h1>
  <p id="toast" hidden></p>

  <div id="scanView">
    <p class="hint">請掃證明聯<strong>左邊</strong>的 QR（對準中間框）。掃不太到可改拍照辨識，紙本發票可手動輸入。</p>
    <label id="camLabel" hidden>鏡頭
      <select id="camSelect"></select>
    </label>
    <div id="reader"><div id="qrbox"></div></div>
    <p class="hint">對準後還是糊的，點一下畫面可重新對焦。</p>
    <div class="actions">
      <button type="button" id="startCam">開啟相機</button>
      <button type="button" id="stopCam">關閉相機</button>
    </div>
    <div class="actions">
      <label class="filebtn">拍照辨識
        <input id="photo" type="file" accept="image/*" capture="environment">
      </label>
      <button type="button" id="manualEntry">手動輸入</button>
    </div>
    <label for="password">共用密碼</label>
    <input id="password" type="password" autocomplete="current-password">
    <div class="actions">
      <button type="button" id="sendAll">全部送出</button>
    </div>
    <p id="error"></p>
    <p id="result"></p>
    <div id="queue"></div>
    <label for="manual">或貼上 QR 文字</label>
    <textarea id="manual" rows="3" placeholder="掃不到時可把 QR 內容貼在這裡"></textarea>
    <button type="button" id="parseManual">解析文字</button>
  </div>

  <div id="fillView" hidden>
    <label for="fillDate">發票日期</label>
    <input id="fillDate" type="date">
    <label for="fillNumber">發票號碼</label>
    <input id="fillNumber" maxlength="10" placeholder="AB12345678，收據可空白" autocapitalize="characters" autocomplete="off">
    <label for="fillSeller">賣方統編</label>
    <input id="fillSeller" inputmode="numeric" maxlength="8" placeholder="傳統發票可空白" autocomplete="off">
    <label for="fillTotal">含稅總額</label>
    <input id="fillTotal" inputmode="decimal" placeholder="0">
    <label for="fillType">發票類型</label>
    <select id="fillType"></select>
    <label>憑證品項</label>
    <div class="row" id="fillItems"></div>
    <label>備註（可複選）</label>
    <div class="row" id="fillChips"></div>
    <input id="fillNoteText" placeholder="其他備註">
    <p id="fillError"></p>
    <div class="actions">
      <button type="button" id="backScan">回去掃下一張</button>
      <button type="button" id="deleteEntry">刪除這張</button>
    </div>
  </div>

  <script type="module">
    // 部署 Apps Script 網頁應用程式後，把網址貼在這裡。
    const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbyeKUYClEQsz5fDUDvalD6TDTx0jHVR2ZFHKllwH341G1GtJAG7K2eFYht29oR7YdhNNA/exec';
    const ITEMS = ['餐費', '油錢', '停車費', '交通', '雜支'];
    const NOTE_CHIPS = ['飲料', '1人', '2人', '3人', '4人', '5人', '5人以上'];
    const INVOICE_TYPES = ['01電子發票', '02傳統發票', '03收據'];
    const PASS_KEY = 'einvoice-password';
    const LIST_KEY = 'einvoice-queue';
    const CAM_KEY = 'einvoice-camera';
    const ZXING_OPTS = { tryHarder: true, formats: ['QRCode'], maxNumberOfSymbols: 8 };
    const SCAN_FPS = 12;
    const CROP_RATIO = 0.65;

    let parseLeft = null;
    try {
      const mod = await import('https://cdn.jsdelivr.net/npm/@hsuan741220/tw-einvoice-qr@1.0.0/+esm');
      parseLeft = (text) => {
        const result = mod.safeParseLeftQr(text);
        if (!result.success) return parsePrefix(text);
        return {
          invoiceNumber: result.data.invoiceNumber,
          date: result.data.date,
          rocDate: result.data.rocDate,
          sellerId: result.data.sellerIdentifier,
          totalAmount: result.data.totalAmount,
        };
      };
    } catch {
      parseLeft = parsePrefix;
    }

    let readBarcodes = null;
    try {
      const zx = await import('https://cdn.jsdelivr.net/npm/zxing-wasm@3.1.7/dist/es/reader/index.js');
      readBarcodes = zx.readBarcodes;
    } catch {}

    const $ = (id) => document.getElementById(id);
    const errorEl = $('error');
    const fillErrorEl = $('fillError');
    const resultEl = $('result');
    const passInput = $('password');
    passInput.value = localStorage.getItem(PASS_KEY) || '';

    const typeSel = $('fillType');
    INVOICE_TYPES.forEach((name) => {
      const opt = document.createElement('option');
      opt.value = name;
      opt.textContent = name;
      typeSel.appendChild(opt);
    });

    let queue = loadList();
    let lastHandled = '';
    let starting = false;
    let running = false;
    let looping = false;
    let decoding = false;
    let lastFrame = 0;
    let stream = null;
    let videoEl = null;
    let cropCanvas = null;
    let editing = null;

    function showError(msg) {
      errorEl.textContent = msg || '';
    }

    function showFillError(msg) {
      fillErrorEl.textContent = msg || '';
    }

    function composeNote(chips, text) {
      const parts = NOTE_CHIPS.filter((c) => chips && chips.includes(c));
      const extra = String(text || '').trim();
      if (extra) parts.push(extra);
      return parts.join('、');
    }

    function splitNote(note) {
      const parts = String(note || '').split('、').map((s) => s.trim()).filter(Boolean);
      const chips = [];
      const rest = [];
      for (const p of parts) {
        if (NOTE_CHIPS.includes(p) && !chips.includes(p)) chips.push(p);
        else rest.push(p);
      }
      return { noteChips: NOTE_CHIPS.filter((c) => chips.includes(c)), noteText: rest.join('、') };
    }

    function loadList() {
      try {
        const arr = JSON.parse(localStorage.getItem(LIST_KEY) || '[]');
        if (!Array.isArray(arr)) return [];
        return arr.map((e) => normalizeEntry(e)).filter(Boolean);
      } catch {
        return [];
      }
    }

    function newLocalId() {
      return 'R' + Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    function normalizeEntry(e) {
      if (!e || typeof e !== 'object') return null;
      if (!e.invoiceNumber && !e.localId) return null;
      let chips = Array.isArray(e.noteChips) ? e.noteChips.filter((c) => NOTE_CHIPS.includes(c)) : null;
      let text = e.noteText;
      if (!chips) {
        const split = splitNote(e.note);
        chips = split.noteChips;
        if (text == null) text = split.noteText;
      }
      e.noteChips = NOTE_CHIPS.filter((c) => chips.includes(c));
      e.noteText = text || '';
      e.note = composeNote(e.noteChips, e.noteText);
      if (!INVOICE_TYPES.includes(e.invoiceType)) e.invoiceType = INVOICE_TYPES[0];
      return e;
    }

    function saveList() {
      if (editing) editing.note = composeNote(editing.noteChips, editing.noteText);
      localStorage.setItem(LIST_KEY, JSON.stringify(queue));
    }

    function parsePrefix(text) {
      const raw = String(text || '').trim();
      if (raw.startsWith('**')) throw new Error('這是右邊的 QR，請改掃左邊（有發票號碼的那張）');
      if (raw.length < 77) throw new Error('QR 內容太短，請掃左邊的 QR');
      const invoiceNumber = raw.slice(0, 10);
      if (!/^[A-Z]{2}\d{8}$/.test(invoiceNumber)) throw new Error('發票號碼格式不對，請掃左邊的 QR');
      const rocDate = raw.slice(10, 17);
      if (!/^\d{7}$/.test(rocDate)) throw new Error('日期格式不對');
      const year = Number(rocDate.slice(0, 3)) + 1911;
      const month = rocDate.slice(3, 5);
      const day = rocDate.slice(5);
      const sales = Number.parseInt(raw.slice(21, 29), 16);
      const totalAmount = Number.parseInt(raw.slice(29, 37), 16);
      if (!Number.isFinite(totalAmount)) throw new Error('金額格式不對');
      if (Number.isFinite(sales) && totalAmount < sales) throw new Error('金額格式不對');
      const sellerId = raw.slice(45, 53);
      if (!/^\d{8}$/.test(sellerId)) throw new Error('賣方統編格式不對');
      return { invoiceNumber, date: `${year}-${month}-${day}`, rocDate, sellerId, totalAmount };
    }

    function pickLeftText(texts) {
      const list = (texts || []).map((t) => String(t || '').trim()).filter(Boolean);
      for (const t of list) {
        if (t.startsWith('**')) continue;
        try {
          parsePrefix(t);
          return t;
        } catch {}
      }
      return list.find((t) => t.startsWith('**')) || null;
    }

    let audioCtx = null;
    let toastTimer = 0;

    function unlockAudio() {
      try {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return;
        if (!audioCtx) audioCtx = new AC();
        if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch {}
    }

    function beep() {
      try {
        if (!audioCtx) return;
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.value = 880;
        gain.gain.setValueAtTime(0.12, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.12);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.12);
      } catch {}
    }

    function showToast(msg, kind) {
      const el = $('toast');
      el.textContent = msg;
      el.className = kind;
      el.hidden = false;
      const reader = $('reader');
      reader.classList.toggle('flash', kind === 'ok');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(() => {
        el.hidden = true;
        reader.classList.remove('flash');
      }, 1500);
    }

    function addEntry(data) {
      if (queue.some((e) => e.invoiceNumber === data.invoiceNumber)) {
        showToast('清單裡已有這張', 'dup');
        showError('');
        return null;
      }
      const entry = {
        invoiceNumber: data.invoiceNumber,
        date: data.date,
        sellerId: data.sellerId,
        totalAmount: data.totalAmount,
        item: '',
        noteChips: [],
        noteText: '',
        note: '',
        invoiceType: INVOICE_TYPES[0],
        manual: false,
        status: '',
      };
      queue.unshift(entry);
      saveList();
      renderQueue();
      showError('');
      showToast('已加入：' + data.invoiceNumber + '（共 ' + queue.length + ' 張）', 'ok');
      try { if (navigator.vibrate) navigator.vibrate(150); } catch {}
      beep();
      return entry;
    }

    async function handleScan(text) {
      if (editing) return;
      const raw = String(text || '').trim();
      if (!raw || raw === lastHandled) return;
      try {
        if (raw.startsWith('**')) throw new Error('這是右邊的 QR，請改掃左邊（有發票號碼的那張）');
        const data = parseLeft(raw);
        lastHandled = raw;
        const entry = addEntry(data);
        if (entry) await openFill(entry);
      } catch (err) {
        lastHandled = raw;
        showError(err.message || String(err));
      }
    }

    async function textsFromSource(src) {
      if (!readBarcodes) throw new Error('辨識套件載入失敗');
      const results = await readBarcodes(src, ZXING_OPTS);
      return (results || []).map((r) => String(r.text || '').trim()).filter(Boolean);
    }

    function drawScaled(bmp, maxSide) {
      let w = bmp.width;
      let h = bmp.height;
      if (maxSide && Math.max(w, h) > maxSide) {
        const s = maxSide / Math.max(w, h);
        w = Math.round(w * s);
        h = Math.round(h * s);
      }
      const c = document.createElement('canvas');
      c.width = w;
      c.height = h;
      c.getContext('2d').drawImage(bmp, 0, 0, w, h);
      return c;
    }

    async function decodePhoto(file) {
      let picked = null;
      try { picked = pickLeftText(await textsFromSource(file)); } catch {}
      if (picked && !picked.startsWith('**')) return picked;
      let bmp;
      try { bmp = await createImageBitmap(file); } catch { return picked; }
      try {
        const sizes = [];
        const long = Math.max(bmp.width, bmp.height);
        if (long > 2000) sizes.push(0);
        sizes.push(2000, 1200);
        for (const max of sizes) {
          const canvas = drawScaled(bmp, max || long);
          const ctx = canvas.getContext('2d', { willReadFrequently: true });
          const data = ctx.getImageData(0, 0, canvas.width, canvas.height);
          try { picked = pickLeftText(await textsFromSource(data)); } catch { continue; }
          if (picked && !picked.startsWith('**')) return picked;
        }
      } finally {
        if (bmp && bmp.close) bmp.close();
      }
      return picked;
    }

    function renderQueue() {
      const box = $('queue');
      box.replaceChildren();
      const count = document.createElement('p');
      count.className = queue.length ? '' : 'hint';
      count.textContent = queue.length ? '待送出 ' + queue.length + ' 張（點一筆可改）' : '還沒有發票';
      box.appendChild(count);
      queue.forEach((entry) => {
        const div = document.createElement('div');
        div.className = 'entry';
        const missing = !String(entry.item || '').trim();
        if (missing) div.classList.add('missing');
        const meta = document.createElement('p');
        meta.className = 'meta';
        meta.textContent = `${entry.date}　${entry.invoiceNumber || '無號碼'}　金額 ${entry.totalAmount}　${missing ? '未選品項' : entry.item}`;
        div.appendChild(meta);
        if (entry.status) {
          const st = document.createElement('p');
          st.className = 'status';
          st.textContent = entry.status;
          div.appendChild(st);
        }
        div.addEventListener('click', () => openFill(entry));
        box.appendChild(div);
      });
      $('sendAll').disabled = queue.length === 0;
    }

    function renderFill(entry) {
      showFillError('');
      const editable = !!entry.manual;
      $('fillDate').value = entry.date || '';
      $('fillNumber').value = entry.invoiceNumber || '';
      $('fillSeller').value = entry.sellerId || '';
      $('fillTotal').value = entry.totalAmount === 0 || entry.totalAmount ? String(entry.totalAmount) : '';
      $('fillType').value = INVOICE_TYPES.includes(entry.invoiceType) ? entry.invoiceType : INVOICE_TYPES[0];
      ['fillDate', 'fillNumber', 'fillSeller', 'fillTotal', 'fillType'].forEach((id) => {
        $(id).disabled = !editable;
      });
      $('fillItems').querySelectorAll('button').forEach((b) => {
        b.setAttribute('aria-pressed', b.textContent === entry.item ? 'true' : 'false');
      });
      const selected = new Set(entry.noteChips || []);
      $('fillChips').querySelectorAll('button').forEach((b) => {
        b.setAttribute('aria-pressed', selected.has(b.textContent) ? 'true' : 'false');
      });
      $('fillNoteText').value = entry.noteText || '';
    }

    async function openFill(entry) {
      await stopCamera();
      editing = entry;
      $('scanView').hidden = true;
      $('fillView').hidden = false;
      renderFill(entry);
    }

    function todayIso() {
      const d = new Date();
      const m = String(d.getMonth() + 1).padStart(2, '0');
      const day = String(d.getDate()).padStart(2, '0');
      return `${d.getFullYear()}-${m}-${day}`;
    }

    function saveEditing() {
      if (!editing) return true;
      editing.note = composeNote(editing.noteChips, editing.noteText);
      if (editing.manual) {
        const date = $('fillDate').value;
        const invoiceType = $('fillType').value;
        let invoiceNumber = $('fillNumber').value.trim();
        const sellerId = $('fillSeller').value.trim();
        const totalRaw = $('fillTotal').value.trim();
        const totalAmount = Number(totalRaw);
        if (!/^\d{4}-\d{2}-\d{2}$/.test(date)) { showFillError('請填發票日期'); return false; }
        if (!INVOICE_TYPES.includes(invoiceType)) { showFillError('請選發票類型'); return false; }
        if (invoiceType === '03收據') {
          if (invoiceNumber.length > 20 || /[\r\n\t]/.test(invoiceNumber)) { showFillError('收據號碼請在 20 字以內'); return false; }
        } else {
          invoiceNumber = invoiceNumber.toUpperCase();
          if (!/^[A-Z]{2}\d{8}$/.test(invoiceNumber)) { showFillError('發票號碼格式不對（兩碼英文＋八碼數字）'); return false; }
        }
        if (sellerId && !/^\d{8}$/.test(sellerId)) { showFillError('賣方統編須為 8 碼數字，可空白'); return false; }
        if (totalRaw === '' || !Number.isFinite(totalAmount) || totalAmount < 0) { showFillError('請填含稅總額'); return false; }
        if (invoiceNumber && queue.some((e) => e !== editing && String(e.invoiceNumber || '').toUpperCase() === invoiceNumber.toUpperCase())) {
          showFillError('清單裡已有這張');
          return false;
        }
        editing.date = date;
        editing.invoiceNumber = invoiceNumber;
        editing.sellerId = sellerId;
        editing.totalAmount = totalAmount;
        editing.invoiceType = invoiceType;
        if (!invoiceNumber && !editing.localId) editing.localId = newLocalId();
        if (!queue.includes(editing)) queue.unshift(editing);
      }
      saveList();
      return true;
    }

    async function backToScan(restart) {
      if (editing && !saveEditing()) return;
      editing = null;
      showFillError('');
      $('fillView').hidden = true;
      $('scanView').hidden = false;
      renderQueue();
      if (restart) await startCamera();
    }

    ITEMS.forEach((name) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = name;
      btn.addEventListener('click', () => {
        if (!editing) return;
        editing.item = name;
        $('fillItems').querySelectorAll('button').forEach((b) => b.setAttribute('aria-pressed', b === btn ? 'true' : 'false'));
        saveList();
      });
      $('fillItems').appendChild(btn);
    });

    NOTE_CHIPS.forEach((name) => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.textContent = name;
      btn.addEventListener('click', () => {
        if (!editing) return;
        const on = !(editing.noteChips || []).includes(name);
        const set = new Set(editing.noteChips || []);
        if (on) set.add(name); else set.delete(name);
        editing.noteChips = NOTE_CHIPS.filter((c) => set.has(c));
        btn.setAttribute('aria-pressed', on ? 'true' : 'false');
        saveList();
      });
      $('fillChips').appendChild(btn);
    });

    $('fillNoteText').addEventListener('input', () => {
      if (!editing) return;
      editing.noteText = $('fillNoteText').value;
      saveList();
    });

    $('backScan').addEventListener('click', () => backToScan(true));
    $('deleteEntry').addEventListener('click', () => {
      if (editing) {
        const i = queue.indexOf(editing);
        if (i >= 0) queue.splice(i, 1);
        if (lastHandled && lastHandled.includes(editing.invoiceNumber)) lastHandled = '';
        editing = null;
        saveList();
      }
      backToScan(true);
    });

    function scoreCam(cam) {
      const l = String(cam.label || '').toLowerCase();
      if (/front|user|前置|前鏡頭/.test(l)) return -2;
      if (/ultra\s*wide|超廣角/.test(l)) return -1;
      if (/telephoto|望遠/.test(l)) return -1;
      const back = /back|rear|後置|後鏡頭|facing back/.test(l);
      const plain = /(back camera|後置相機)/.test(l) && !/ultra|tele|超廣|望遠|dual|triple/.test(l);
      if (plain) return 4;
      if (back && !/dual|triple/.test(l)) return 3;
      if (back) return 2;
      return 0;
    }

    function pickCam(cams) {
      if (!cams || !cams.length) return '';
      const saved = localStorage.getItem(CAM_KEY);
      if (saved && cams.some((c) => c.id === saved)) return saved;
      return cams.slice().sort((a, b) => scoreCam(b) - scoreCam(a))[0].id;
    }

    function fillCamSelect(cams) {
      const sel = $('camSelect');
      const label = $('camLabel');
      if (!cams || !cams.length) {
        label.hidden = true;
        return;
      }
      const current = sel.value || pickCam(cams);
      sel.replaceChildren();
      cams.forEach((c, i) => {
        const opt = document.createElement('option');
        opt.value = c.id;
        opt.textContent = c.label || ('鏡頭 ' + (i + 1));
        sel.appendChild(opt);
      });
      if (current && cams.some((c) => c.id === current)) sel.value = current;
      label.hidden = false;
    }

    async function listCams() {
      try {
        const all = await navigator.mediaDevices.enumerateDevices();
        const cams = all.filter((d) => d.kind === 'videoinput').map((d) => ({ id: d.deviceId, label: d.label }));
        fillCamSelect(cams);
        return cams;
      } catch {
        return [];
      }
    }

    function ensureVideo() {
      const box = $('reader');
      if (!videoEl) {
        videoEl = document.createElement('video');
        videoEl.setAttribute('playsinline', '');
        videoEl.setAttribute('muted', '');
        videoEl.muted = true;
        videoEl.autoplay = true;
        box.insertBefore(videoEl, $('qrbox'));
      }
      if (!cropCanvas) cropCanvas = document.createElement('canvas');
    }

    async function tryFocus() {
      const track = stream && stream.getVideoTracks()[0];
      if (!track || !track.getCapabilities) return;
      let caps;
      try { caps = track.getCapabilities(); } catch { return; }
      if (!caps.focusMode) return;
      const mode = caps.focusMode.includes('continuous') ? 'continuous'
        : caps.focusMode.includes('single-shot') ? 'single-shot' : '';
      if (!mode) return;
      try { await track.applyConstraints({ advanced: [{ focusMode: mode }] }); } catch {}
    }

    async function startWith(cameraId) {
      const video = {
        width: { ideal: 1920 },
        height: { ideal: 1080 },
      };
      if (cameraId) video.deviceId = { exact: cameraId };
      else video.facingMode = { ideal: 'environment' };
      try {
        stream = await navigator.mediaDevices.getUserMedia({ audio: false, video });
      } catch (err) {
        if (cameraId) return startWith('');
        throw err;
      }
      ensureVideo();
      videoEl.srcObject = stream;
      await videoEl.play();
      const id = stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getSettings().deviceId;
      if (id) {
        localStorage.setItem(CAM_KEY, id);
        if ($('camSelect').value !== id) $('camSelect').value = id;
      }
    }

    async function tick(t) {
      if (!looping || !running) return;
      requestAnimationFrame(tick);
      if (decoding || editing) return;
      if (t - lastFrame < 1000 / SCAN_FPS) return;
      lastFrame = t;
      if (!videoEl || videoEl.readyState < 2) return;
      const w = videoEl.videoWidth;
      const h = videoEl.videoHeight;
      if (!w || !h) return;
      const side = Math.max(1, Math.floor(Math.min(w, h) * CROP_RATIO));
      const sx = Math.floor((w - side) / 2);
      const sy = Math.floor((h - side) / 2);
      cropCanvas.width = side;
      cropCanvas.height = side;
      const ctx = cropCanvas.getContext('2d', { willReadFrequently: true });
      ctx.drawImage(videoEl, sx, sy, side, side, 0, 0, side, side);
      const imageData = ctx.getImageData(0, 0, side, side);
      decoding = true;
      try {
        const text = pickLeftText(await textsFromSource(imageData));
        if (text) await handleScan(text);
      } catch {}
      decoding = false;
    }

    async function startCamera() {
      unlockAudio();
      if (starting) return;
      starting = true;
      showError('');
      if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
        showError('這個瀏覽器不能開相機，請改拍照辨識或手動輸入');
        starting = false;
        return;
      }
      if (!readBarcodes) {
        showError('辨識套件載入失敗，請改拍照辨識或手動輸入');
        starting = false;
        return;
      }
      try {
        if (running) await stopCamera();
        let cams = await listCams();
        const chosen = $('camSelect').value || pickCam(cams);
        await startWith(chosen);
        running = true;
        await tryFocus();
        if (!cams.length || cams.every((c) => !c.label)) {
          cams = await listCams();
          const preferred = pickCam(cams);
          const current = stream && stream.getVideoTracks()[0] && stream.getVideoTracks()[0].getSettings().deviceId;
          if (preferred && preferred !== current) {
            await stopCamera();
            await startWith(preferred);
            running = true;
            await tryFocus();
          }
        }
        looping = true;
        lastFrame = 0;
        requestAnimationFrame(tick);
      } catch (err) {
        running = false;
        showError('無法開啟相機：' + (err && err.message ? err.message : err));
      } finally {
        starting = false;
      }
    }

    async function stopCamera() {
      looping = false;
      running = false;
      if (videoEl) {
        try { videoEl.pause(); } catch {}
        videoEl.srcObject = null;
      }
      if (stream) {
        stream.getTracks().forEach((t) => t.stop());
        stream = null;
      }
    }

    async function postEntry(entry, password) {
      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({
          password,
          invoiceNumber: entry.invoiceNumber,
          date: entry.date,
          sellerId: entry.sellerId,
          totalAmount: entry.totalAmount,
          item: entry.item,
          note: entry.note,
          invoiceType: entry.invoiceType || INVOICE_TYPES[0],
        }),
        redirect: 'follow',
      });
      const text = await res.text();
      let body;
      try { body = JSON.parse(text); } catch { throw new Error('伺服器回應不是 JSON：' + text.slice(0, 200)); }
      return body;
    }

    $('startCam').addEventListener('click', startCamera);
    $('stopCam').addEventListener('click', stopCamera);
    $('reader').addEventListener('click', () => {
      if (running && !starting) startCamera();
    });
    $('camSelect').addEventListener('change', () => {
      localStorage.setItem(CAM_KEY, $('camSelect').value);
      if (running || starting) startCamera();
    });
    $('parseManual').addEventListener('click', () => {
      unlockAudio();
      lastHandled = '';
      handleScan($('manual').value);
    });
    $('photo').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = '';
      if (!file) return;
      unlockAudio();
      showError('');
      try {
        const text = await decodePhoto(file);
        if (!text) throw new Error('辨識不到左邊的 QR，請再拍一次或改手動輸入');
        lastHandled = '';
        await handleScan(text);
      } catch (err) {
        showError(err.message || String(err));
      }
    });
    $('manualEntry').addEventListener('click', async () => {
      unlockAudio();
      const draft = {
        invoiceNumber: '',
        date: todayIso(),
        sellerId: '',
        totalAmount: '',
        item: '',
        noteChips: [],
        noteText: '',
        note: '',
        invoiceType: INVOICE_TYPES[0],
        manual: true,
        status: '',
      };
      await openFill(draft);
    });

    $('sendAll').addEventListener('click', async () => {
      showError('');
      resultEl.textContent = '';
      resultEl.className = '';
      if (!queue.length) { showError('請先掃描發票'); return; }
      if (queue.some((e) => !String(e.item || '').trim())) {
        showError('還有發票沒選憑證品項，請點清單補填');
        return;
      }
      const password = passInput.value;
      if (!password) { showError('請輸入共用密碼'); return; }
      if (!SCRIPT_URL || SCRIPT_URL.startsWith('PASTE_')) {
        showError('還沒填 Apps Script 網址，請先部署後貼到 index.html 的 SCRIPT_URL');
        return;
      }
      localStorage.setItem(PASS_KEY, password);
      $('sendAll').disabled = true;
      await stopCamera();
      const lines = [];
      const keep = [];
      for (const entry of [...queue].reverse()) {
        entry.item = String(entry.item || '').trim();
        entry.note = composeNote(entry.noteChips, entry.noteText);
        try {
          const body = await postEntry(entry, password);
          if (body.ok) {
            lines.push(`${entry.invoiceNumber || '無號碼'}：成功（${body.tab}／第 ${body.row} 列）`);
          } else if (body.msg === '已經掃過') {
            lines.push(`${entry.invoiceNumber || '無號碼'}：已經掃過`);
          } else {
            entry.status = body.msg || '送出失敗';
            lines.push(`${entry.invoiceNumber || '無號碼'}：${entry.status}`);
            keep.push(entry);
          }
        } catch (err) {
          entry.status = err.message || String(err);
          lines.push(`${entry.invoiceNumber}：${entry.status}`);
          keep.push(entry);
        }
      }
      queue = keep.reverse();
      saveList();
      renderQueue();
      resultEl.className = keep.length ? '' : 'ok';
      resultEl.textContent = lines.join('\n');
    });

    renderQueue();
  </script>
</body>
</html>
